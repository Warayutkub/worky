<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Worky | timesave</title>
</head>

<body class="flex flex-col items-center gap-6 bg-gray-50 min-h-screen pb-20">

    

    <div class="bg-white shadow-xl rounded-3xl border border-gray-100 p-8 w-[95%] max-w-2xl flex flex-col gap-8">
        
        <div class="flex flex-row justify-between items-center gap-6 bg-blue-50 p-6 rounded-2xl border border-blue-100">
            <div class="flex flex-col gap-2 font-semibold text-blue-950">
                <span class="text-4xl">15 Hr.</span>
                <span class="text-2xl text-blue-800/80">30 min.</span>
            </div>
            
            <div class="bg-blue-200 w-px h-16 rounded-full"></div> 
            
            <div class="flex flex-col gap-1 items-end font-bold text-right text-blue-950">
                <span class="text-5xl">15.5</span>
                <span class="text-2xl text-blue-800/80">Hr.</span>
            </div>
        </div>

        <form action="" class="flex flex-col gap-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="flex flex-col gap-2">
                    <label for="time-start" class="font-semibold text-gray-700">Time Starts</label>
                    <input type="time" name="time-start" id="time-start" 
                           class="border border-gray-200 p-3.5 rounded-xl bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white focus:border-blue-300 transition">
                </div>

                <div class="flex flex-col gap-2">
                    <label for="time-end" class="font-semibold text-gray-700">Time End</label>
                    <input type="time" name="time-end" id="time-end" 
                           class="border border-gray-200 p-3.5 rounded-xl bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white focus:border-blue-300 transition">
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label for="extends" class="font-semibold text-gray-700">What did you do?</label>
                <textarea id="extends" name="extends" rows="4" placeholder="e.g., Design screens for Worky app" 
                          class="border border-gray-200 p-4 rounded-xl bg-gray-50/50 w-full break-words resize-y focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white focus:border-blue-300 transition"></textarea>
            </div>

            <button type="submit" class="bg-green-400 text-green-950 font-bold rounded-xl p-4 hover:bg-green-500 transition shadow-md hover:shadow-lg">
                Save Work Time
            </button>
        </form>
    </div>

    <nav
        class="flex fixed bottom-0 bg-gradient-to-b from-[#1e90ff] to-[#4169e1] w-full h-16 p-2 justify-evenly shadow-md">

        <img src="/assets/history_icon.svg" alt="history" id="btn-to-history" width="50" height="50">
        <img src="/assets/home_icon.svg" alt="home" id="btn-to-home" width="40" height="40">
        <img src="/assets/clock_icon.svg" id="btn-to-timeSave" alt="home" width="50" height="50">

    </nav>

    <script src="../action/navAction.js"></script>
</body>

</html>

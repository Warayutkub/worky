<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Worky | History</title>
</head>

<body class="flex flex-col items-center gap-6 bg-gray-50 min-h-screen pb-24">

    <!-- Header Section -->
    <div class="w-full max-w-md px-6 pt-6 flex justify-between items-center">
        <h1 class="font-bold text-2xl text-gray-800">
            Work History
        </h1>
        <div class="flex items-center gap-2">
            <!-- Badge แสดงชั่วโมงรวมทั้งหมด -->
            <span id="grand-total-badge" class="text-xs font-semibold bg-blue-100 text-blue-800 px-3 py-1 rounded-full">
                Total 0.0 Hrs
            </span>
            <!-- ปุ่ม Refresh -->
            <button title="refresh" id="btn-refresh-history" class="p-1.5 text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-lg border border-blue-200 transition-all active:scale-95">
                <svg id="refresh-icon" class="w-4 h-4 text-blue-600 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Dynamic History Container -->
    <div id="history-container" class="w-full max-w-md px-6 flex flex-col gap-6">

        <!-- Skeleton Loading (จะถูกซ่อนอัตโนมัติเมื่อข้อมูลมา) -->
        <div id="history-loading" class="flex flex-col gap-3">
            <div class="flex justify-between items-center border-b border-gray-200 pb-2">
                <div class="h-6 bg-gray-200 rounded animate-pulse w-32"></div>
                <div class="h-4 bg-gray-200 rounded animate-pulse w-20"></div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm h-20 animate-pulse"></div>
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm h-20 animate-pulse"></div>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <nav class="flex fixed bottom-0 left-0 bg-gradient-to-b from-[#1e90ff] to-[#4169e1] w-full h-16 p-2 justify-evenly shadow-lg border-t border-white/10 z-50">
        <div class="p-2 rounded-xl cursor-pointer" id="btn-to-history">
            <img src="../assets/history_icon.svg" alt="history" width="32" height="32">
        </div>
        <div class="p-2 rounded-xl cursor-pointer hover:bg-white/10 transition" id="btn-to-home">
            <img src="../assets/home_icon.svg" alt="home" width="32" height="32">
        </div>
        <div class="p-2 rounded-xl cursor-pointer hover:bg-white/10 transition" id="btn-to-timeSave">
            <img src="../assets/clock_icon.svg" alt="clock" width="32" height="32">
        </div>
    </nav>

    <script src="../action/navAction.js"></script>
    <script src="../action/history.js"></script>
</body>

</html>

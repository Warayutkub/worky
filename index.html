<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Worky</title>
</head>

<body class="flex flex-col items-center gap-6 bg-gray-50 min-h-screen pb-24">

    <div class="w-full max-w-md px-6 pt-6 flex flex-col gap-3">
        <h1 class="font-bold text-xl text-gray-800">
            Total Hours
        </h1>

        <div class="flex flex-row justify-between items-center gap-6 bg-blue-50 p-6 rounded-2xl border border-blue-100 shadow-sm">
            <div class="flex flex-col gap-1 font-semibold text-blue-950">
                <span class="text-3xl font-bold">15 Hr.</span>
                <span class="text-xl text-blue-800/80">30 min.</span>
            </div>
            
            <div class="bg-blue-200 w-px h-14 rounded-full"></div>

            <div class="flex flex-col gap-1 items-end font-bold text-right text-blue-950">
                <span class="text-4xl">15.5</span>
                <span class="text-lg text-blue-800/80">Hr.</span>
            </div>
        </div>
    </div>

    <div class="w-full max-w-md px-6 flex flex-col gap-3 flex-1">
        <h1 class="font-bold text-xl text-gray-800">
            Average
        </h1>

        <div class="bg-white shadow-sm border border-gray-100 p-4 rounded-2xl w-full h-72">
            <canvas id="AverageChartMain"></canvas>
        </div>
    </div>

    <nav
        class="flex fixed bottom-0 bg-gradient-to-b from-[#1e90ff] to-[#4169e1] w-full h-16 p-2 justify-evenly shadow-md">

        <img src="/assets/history_icon.svg" alt="history" id="btn-to-history" width="50" height="50">
        <img src="/assets/home_icon.svg" alt="home" id="btn-to-home" width="40" height="40">
        <img src="/assets/clock_icon.svg" id="btn-to-timeSave" alt="home" width="50" height="50">

    </nav>

    <script src="./action/navAction.js"></script>
    <script src="./action/chartAction.js"></script>
</body>

</html>
